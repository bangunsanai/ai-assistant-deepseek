<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant - DeepSeek V3.2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 1000px;
            height: 90vh;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chat-header {
            padding: 20px 24px;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .chat-header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            background: linear-gradient(135deg, #fff, #a0a0b0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .header-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .expert-selector {
            background: #2d2d44;
            border: 1px solid #4c6ef5;
            color: white;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .clear-btn {
            background: #4c6ef5;
            border: none;
            border-radius: 40px;
            padding: 8px 20px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .clear-btn:hover {
            background: #5f7eff;
            transform: scale(0.98);
        }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .message {
            display: flex;
            gap: 14px;
            max-width: 85%;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .bot-message {
            align-self: flex-start;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #2d2d44;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .user-message .avatar {
            background: #4c6ef5;
        }

        .message-content {
            background: #2d2d44;
            padding: 12px 18px;
            border-radius: 20px;
            line-height: 1.5;
            font-size: 0.95rem;
            color: #e2e2e6;
            word-wrap: break-word;
        }

        .user-message .message-content {
            background: #4c6ef5;
            color: white;
        }

        .input-area {
            padding: 18px 24px 24px;
            background: rgba(0, 0, 0, 0.2);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            background: #2a2a3c;
            border-radius: 60px;
            padding: 6px 6px 6px 20px;
            border: 1px solid #3d3d54;
            transition: all 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: #4c6ef5;
            box-shadow: 0 0 0 2px rgba(76, 110, 245, 0.2);
        }

        .input-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 12px 0;
            font-size: 1rem;
            color: #f0f0f0;
            outline: none;
        }

        .input-wrapper input::placeholder {
            color: #7c7c96;
        }

        .input-wrapper button {
            background: #4c6ef5;
            border: none;
            border-radius: 40px;
            padding: 8px 24px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
        }

        .input-wrapper button:hover {
            background: #5f7eff;
            transform: scale(0.98);
        }

        .typing-indicator {
            display: flex;
            gap: 6px;
            padding: 12px 18px;
            background: #2d2d44;
            border-radius: 20px;
            width: fit-content;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #9ca3af;
            border-radius: 50%;
            display: inline-block;
            animation: bounce 1.2s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(1) { animation-delay: 0s; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.15s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.3s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }

        @media (max-width: 600px) {
            .chat-container { height: 95vh; }
            .message { max-width: 95%; }
            .message-content { font-size: 0.85rem; }
            .chat-header { flex-direction: column; text-align: center; }
            .header-controls { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
<div class="chat-container">
    <div class="chat-header">
        <h1>🤖 AI Assistant</h1>
        <div class="header-controls">
            <select id="expertSelect" class="expert-selector">
                <option value="default">🤖 Asisten Umum</option>
                <option value="programmer">💻 Programmer</option>
                <option value="writer">✍️ Penulis</option>
                <option value="doctor">🏥 Dokter</option>
            </select>
            <button id="clearChatBtn" class="clear-btn">🗑️ Clear</button>
        </div>
    </div>
    <div class="messages-area" id="messagesArea">
        <div class="message bot-message">
            <div class="avatar">🤖</div>
            <div class="message-content">Halo! Saya asisten AI dengan DeepSeek V3.2. Ada yang bisa saya bantu?</div>
        </div>
    </div>
    <div class="input-area">
        <div class="input-wrapper">
            <input type="text" id="userInput" placeholder="Tanya apa saja..." autofocus />
            <button id="sendBtn">Kirim</button>
        </div>
    </div>
</div>

<script>
    const API_CHAT_URL = "/chat";
    const messagesArea = document.getElementById("messagesArea");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const expertSelect = document.getElementById("expertSelect");
    const clearChatBtn = document.getElementById("clearChatBtn");

    let conversationHistory = [];

    function getExpertValue() {
        return expertSelect.value;
    }

    function appendMessage(content, isUser, expertIcon = "🤖") {
        const messageDiv = document.createElement("div");
        messageDiv.className = `message ${isUser ? "user-message" : "bot-message"}`;
        messageDiv.innerHTML = `
            <div class="avatar">${isUser ? "👤" : expertIcon}</div>
            <div class="message-content">${escapeHtml(content)}</div>
        `;
        messagesArea.appendChild(messageDiv);
        messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
    }

    function showTypingIndicator() {
        const typingDiv = document.createElement("div");
        typingDiv.className = "message bot-message";
        typingDiv.id = "typingIndicator";
        typingDiv.innerHTML = `
            <div class="avatar">🤖</div>
            <div class="typing-indicator">
                <span></span><span></span><span></span>
            </div>
        `;
        messagesArea.appendChild(typingDiv);
        messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    function removeTypingIndicator() {
        const indicator = document.getElementById("typingIndicator");
        if (indicator) indicator.remove();
    }

    async function sendMessage() {
        const message = userInput.value.trim();
        if (!message) return;

        // Clear input
        userInput.value = "";

        // Tampilkan pesan user
        appendMessage(message, true);
        conversationHistory.push({ role: "user", content: message });

        // Tampilkan indikator loading
        showTypingIndicator();

        try {
            const response = await fetch(API_CHAT_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: message,
                    expert: getExpertValue(),
                    history: conversationHistory.slice(0, -1),
                    model: "vertex_ai/deepseek-ai/deepseek-v3.2-maas"
                })
            });

            removeTypingIndicator();

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const data = await response.json();
            appendMessage(data.response, false, data.expert_icon || "🤖");
            conversationHistory.push({ role: "assistant", content: data.response });

            // Batasi history
            if (conversationHistory.length > 20) {
                conversationHistory = conversationHistory.slice(-20);
            }

        } catch (error) {
            removeTypingIndicator();
            console.error("Error:", error);
            appendMessage("Maaf, terjadi kesalahan. Pastikan backend AI sedang berjalan.", false);
        }
    }

    function clearChat() {
        conversationHistory = [];
        messagesArea.innerHTML = `
            <div class="message bot-message">
                <div class="avatar">🤖</div>
                <div class="message-content">Chat telah dibersihkan. Ada yang bisa saya bantu?</div>
            </div>
        `;
    }

    // Event listeners
    sendBtn.addEventListener("click", sendMessage);
    userInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") sendMessage();
    });
    clearChatBtn.addEventListener("click", clearChat);
</script>
</body>
</html>
